<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Машинка</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  /* Небо и солнце */
  body {
    background:
      radial-gradient(circle at 85% 18%, #ffd60a 0 40px, transparent 42px),
      linear-gradient(#8ecae6, #e0f4ff);
    position: relative;
  }

  /* Дорога с разметкой */
  body::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 70px;
    background:
      repeating-linear-gradient(90deg, #fff 0 40px, transparent 40px 80px) center / 100% 6px no-repeat,
      #444;
  }

  /* Дерево */
  body::after {
    content: "";
    position: absolute;
    left: 15%;
    bottom: 70px;
    width: 14px;
    height: 70px;
    background: #6b4226;
    box-shadow: 0 -30px 0 28px #2d6a4f;
    border-radius: 3px;
  }

  /* ---------- Машинка (седан, вид сбоку) ---------- */
  .car {
    position: absolute;
    z-index: 1;
    bottom: 60px;
    left: -200px;
    width: 200px;
    height: 56px;
    animation: drive 6s linear infinite;
  }

  /* Кузов: серебристый силуэт седана */
  .body {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(#e63946, #e63946) 1px 24px / 4px 4px no-repeat,     /* задний фонарь */
      linear-gradient(#fff3b0, #fff3b0) 194px 29px / 5px 4px no-repeat,   /* фара */
      linear-gradient(#f4f6f7, #c9ced2 55%, #9ba1a6 80%, #6f7479);
    clip-path: polygon(
      2px 45px, 0 36px, 3px 24px, 20px 20px, 48px 17px, 64px 7px,
      80px 3px, 112px 3px, 138px 17px, 175px 23px, 194px 28px,
      200px 36px, 199px 45px
    );
  }

  /* Окна и стойки */
  .body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, #2f4756 0 47%, #b9c5cc 47% 50%, #2f4756 50%);
    clip-path: polygon(60px 17px, 66px 8px, 80px 5.5px, 111px 5.5px, 130px 17px);
  }

  /* Линии дверей */
  .body::after {
    content: "";
    position: absolute;
    left: 98px;
    top: 17px;
    width: 1px;
    height: 27px;
    background: rgba(0, 0, 0, .25);
    box-shadow: -36px 0 0 rgba(0, 0, 0, .25), 38px 0 0 rgba(0, 0, 0, .25);
  }

  /* Колёса: заднее и переднее, с многоспицевыми дисками */
  .car::before,
  .car::after {
    content: "";
    position: absolute;
    z-index: 1;
    top: 30px;
    width: 18px;
    height: 18px;
    border: 4px solid #1a1a1a;
    border-radius: 50%;
    background:
      radial-gradient(circle, #8a8a8a 0 2px, transparent 3px),
      repeating-conic-gradient(#e8e8e8 0 8deg, #666 8deg 20deg);
    box-shadow: 0 0 0 3px #161616;          /* арка колеса */
    animation: spin 6s linear infinite;
  }
  .car::before { left: 22px; }
  .car::after  { left: 138px; }

  /* Едет слева направо, уезжает за правый край и снова появляется слева */
  @keyframes drive {
    from { left: -200px; }
    to   { left: 100%; }
  }

  @keyframes spin {
    to { transform: rotate(7200deg); }
  }
</style>
</head>
<body>
  <div class="car"><i class="body"></i></div>
</body>
</html>
